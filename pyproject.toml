[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-market-skill-analyzer"
version = "0.1.0"
description = "Reproducible Python/SQLite skill analysis for defined posting datasets with explicit claim boundaries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Meet Tala" }]
dependencies = [
  "pandas>=2.0,<3.0",
  "streamlit>=1.35,<2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0,<3.0"]
anthropic = ["anthropic>=0.30,<1.0"]
dev = [
  "pip-audit>=2.7,<3.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"streamlit_app/app.py" = ["E402"]
"data/generate_sample_postings.py" = ["E501"]
"src/analyzer/taxonomy.py" = ["E501"]
