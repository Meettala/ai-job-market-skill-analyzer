<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AI Job Market Skill Analyzer architecture</title>
  <desc id="desc">Synthetic postings flow through validation, extraction, SQLite storage, reporting and a Streamlit dashboard.</desc>
  <rect width="1200" height="560" rx="28" fill="#0b1020"/>
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f8fafc">AI Job Market Skill Analyzer</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">Synthetic-data, evidence-first analysis pipeline</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="55" y="190" width="190" height="120" rx="18" fill="#172554" stroke="#60a5fa"/><text x="150" y="240" font-size="20" fill="#fff">Synthetic or</text><text x="150" y="270" font-size="20" fill="#fff">permitted postings</text></g>
    <g><rect x="285" y="190" width="190" height="120" rx="18" fill="#172554" stroke="#60a5fa"/><text x="380" y="240" font-size="20" fill="#fff">Validation +</text><text x="380" y="270" font-size="20" fill="#fff">skill extraction</text></g>
    <g><rect x="515" y="190" width="190" height="120" rx="18" fill="#172554" stroke="#60a5fa"/><text x="610" y="240" font-size="20" fill="#fff">Parameterised</text><text x="610" y="270" font-size="20" fill="#fff">SQLite storage</text></g>
    <g><rect x="745" y="190" width="190" height="120" rx="18" fill="#172554" stroke="#60a5fa"/><text x="840" y="240" font-size="20" fill="#fff">Pandas / SQL</text><text x="840" y="270" font-size="20" fill="#fff">reporting</text></g>
    <g><rect x="975" y="190" width="170" height="120" rx="18" fill="#172554" stroke="#60a5fa"/><text x="1060" y="240" font-size="20" fill="#fff">Streamlit +</text><text x="1060" y="270" font-size="20" fill="#fff">JSON export</text></g>
  </g>
  <g stroke="#60a5fa" stroke-width="4" fill="none"><path d="M245 250h40"/><path d="M475 250h40"/><path d="M705 250h40"/><path d="M935 250h40"/></g>
  <g fill="#60a5fa"><path d="M277 242l12 8-12 8z"/><path d="M507 242l12 8-12 8z"/><path d="M737 242l12 8-12 8z"/><path d="M967 242l12 8-12 8z"/></g>
  <rect x="285" y="370" width="420" height="110" rx="18" fill="#111827" stroke="#34d399"/>
  <text x="495" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#d1fae5">Optional provider output is untrusted:</text>
  <text x="495" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a7f3d0">escaped delimiters • strict JSON • safe fallback</text>
  <rect x="745" y="370" width="400" height="110" rx="18" fill="#111827" stroke="#f59e0b"/>
  <text x="945" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#fef3c7">Outputs are traceable to the analysed sample:</text>
  <text x="945" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fde68a">frequency • co-occurrence • candidate gaps</text>
</svg>
