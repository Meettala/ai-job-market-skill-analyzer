<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Job Market Skill Analyzer</title>
  <desc id="desc">Portfolio social preview for a reproducible Python skill-analysis pipeline using synthetic posting data.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172554"/></linearGradient></defs>
  <rect width="1280" height="640" fill="url(#g)"/>
  <circle cx="1110" cy="100" r="240" fill="#2563eb" opacity=".18"/>
  <circle cx="150" cy="590" r="260" fill="#10b981" opacity=".12"/>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="30" fill="#60a5fa">PYTHON • PANDAS • SQLITE • STREAMLIT</text>
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc">Job Market</text>
  <text x="80" y="330" font-family="Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc">Skill Analyzer</text>
  <text x="80" y="405" font-family="Arial, sans-serif" font-size="28" fill="#cbd5e1">Synthetic-data frequency, co-occurrence and entered-skill comparison</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#d1fae5">
    <text x="80" y="495">✓ deterministic no-key extraction</text>
    <text x="470" y="495">✓ explicit optional LLM path</text>
    <text x="850" y="495">✓ CI, audit and Docker</text>
  </g>
  <text x="80" y="575" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">Meet Tala • Portfolio Engineering Project</text>
